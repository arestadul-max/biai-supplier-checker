# Render.com deployment configuration.
# Deploy steps (do this yourself — I cannot host it for you):
#   1. Push this folder to a GitHub repository.
#   2. Go to https://dashboard.render.com → "New" → "Web Service".
#   3. Connect your GitHub repository.
#   4. Render will auto-detect this file. Click "Deploy".
#   5. Your app URL appears in the Render dashboard (takes ~2 minutes).
#
# Free tier: service sleeps after 15 min of inactivity; first request is slow.

services:
  - type: web
    name: biai-supplier-checker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: free
